[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruyfo-planner"
version = "0.6.2"
description = "Logistics planner for the RUYFO point-to-point bike event"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "ortools>=9.10",
    "jinja2",
    "python-multipart",
    "zipcodes",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
# The importable package is `app`; `tests` is not distributable and the helper
# scripts run as `python -m scripts.x` from the repo root. Declaring this avoids
# setuptools' flat-layout auto-discovery erroring on multiple top-level packages.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
