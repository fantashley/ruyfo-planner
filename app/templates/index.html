{% extends "base.html" %}
{% block content %}
<h1>Events</h1>

<section class="card">
  <h2>New event</h2>
  <form method="post" action="/events">
    <label>Name
      <input name="name" placeholder="e.g. Fall RUYFO 2026" required>
    </label>
    <label>Route
      <select name="route_key">
        {% for key, r in ROUTES.items() %}
        <option value="{{ key }}">{{ r.name }} ({{ "%.0f"|format(r.distance_miles) }} mi)</option>
        {% endfor %}
      </select>
    </label>
    <label class="check">
      <input type="checkbox" name="has_sag"> A SAG wagon is available for this event
    </label>
    <button type="submit">Create event</button>
  </form>
</section>
{% endblock %}
