{% extends "base.html" %}
{% block content %}
<div class="page-hero">
  <div>
    <p class="eyebrow">RUYFO logistics</p>
    <h1>Set up an event</h1>
    <p class="muted">Pick the route, then invite the roster. A SAG wagon is added automatically if someone volunteers to drive it.</p>
  </div>
</div>

<section class="card event-form-card">
  <div class="section-head compact">
    <h2>New event</h2>
    <span class="muted">{{ ROUTES|length }} routes</span>
  </div>
  <form method="post" action="/events">
    <label>Name
      <input name="name" placeholder="e.g. Fall RUYFO 2026" required>
    </label>

    <fieldset class="route-picker">
      <legend>Route</legend>
      {% for key, r in ROUTES.items() %}
      <label class="route-choice">
        <input type="radio" name="route_key" value="{{ key }}"{% if loop.first %} checked{% endif %}>
        <span class="route-card">
          <span class="route-title">{{ r.name }}</span>
          <span class="route-meta">
            <span class="loc loc-start">{{ r.start_name }}</span>
            <span class="route-arrow">→</span>
            <span class="loc loc-finish">{{ r.finish_name }}</span>
          </span>
          <span class="badge soft">{{ "%.0f"|format(r.distance_miles) }} mi</span>
        </span>
      </label>
      {% endfor %}
    </fieldset>

    <button class="primary-action" type="submit">Create event</button>
  </form>
</section>
{% endblock %}
